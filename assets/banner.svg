<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#475569" fill-opacity="0.5" />
    </pattern>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 46px;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #ffffff;
      letter-spacing: 0.5px;
    }
    .node-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }

    /* Keyframe Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.75; transform: scale(1.08); }
    }
    @keyframes floatOrb1 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-30px, 20px); }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(25px, -25px); }
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -40; }
    }
    @keyframes cardFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes radarScan {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .anim-orb-1 {
      animation: floatOrb1 9s ease-in-out infinite, pulseGlow 6s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .anim-orb-2 {
      animation: floatOrb2 11s ease-in-out infinite, pulseGlow 7s ease-in-out infinite;
      transform-origin: 950px 300px;
    }
    .flow-line {
      stroke-dasharray: 6, 6;
      animation: dashFlow 2s linear infinite;
    }
    .floating-card-1 {
      animation: cardFloat 5s ease-in-out infinite;
    }
    .floating-card-2 {
      animation: cardFloat 6s ease-in-out infinite 1s;
    }
    .floating-card-3 {
      animation: cardFloat 5.5s ease-in-out infinite 2s;
    }
  </style>

  <!-- Deep Canvas Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Background Dynamic Glowing Orbs (Strictly in Background) -->
  <g class="anim-orb-1">
    <circle cx="200" cy="120" r="160" fill="#0284c7" opacity="0.25" filter="url(#glowCyan)" />
  </g>
  <g class="anim-orb-2">
    <circle cx="980" cy="280" r="190" fill="#7c3aed" opacity="0.25" filter="url(#glowPurple)" />
  </g>

  <!-- Dynamic Security Tech Nodes / Right Wing Visualization -->
  <g transform="translate(680, 50)">
    <!-- Interconnecting Flow Paths -->
    <path class="flow-line" d="M 120 70 L 280 70" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6" fill="none" />
    <path class="flow-line" d="M 280 70 L 200 160" stroke="#6366f1" stroke-width="2" stroke-opacity="0.6" fill="none" />
    <path class="flow-line" d="M 200 160 L 360 210" stroke="#a855f7" stroke-width="2" stroke-opacity="0.6" fill="none" />
    <path class="flow-line" d="M 120 70 L 120 220" stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.5" fill="none" />
    <path class="flow-line" d="M 120 220 L 280 270" stroke="#ec4899" stroke-width="2" stroke-opacity="0.5" fill="none" />

    <!-- Interactive / Floating Nodes -->
    <!-- Node 1: Zero Trust / SSO -->
    <g class="floating-card-1" transform="translate(40, 40)">
      <rect width="150" height="56" rx="14" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" filter="drop-shadow(0 4px 12px rgba(56,189,248,0.2))" />
      <circle cx="28" cy="28" r="12" fill="#0284c7" />
      <!-- Lock Icon -->
      <path d="M 24 28 v -3 a 4 4 0 0 1 8 0 v 3 m -6 0 h 4 a 2 2 0 0 1 2 2 v 4 a 2 2 0 0 1 -2 2 h -4 a 2 2 0 0 1 -2 -2 v -4 a 2 2 0 0 1 2 -2" stroke="#ffffff" stroke-width="1.5" fill="none" />
      <text x="50" y="33" class="node-text">Zero Trust SSO</text>
    </g>

    <!-- Node 2: OAuth 2.0 / OIDC -->
    <g class="floating-card-2" transform="translate(230, 40)">
      <rect width="165" height="56" rx="14" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.5" filter="drop-shadow(0 4px 12px rgba(129,140,248,0.2))" />
      <circle cx="28" cy="28" r="12" fill="#4f46e5" />
      <!-- Key Icon -->
      <circle cx="26" cy="26" r="4" stroke="#ffffff" stroke-width="1.5" fill="none" />
      <path d="M 29 29 l 5 5 m -2 -1 l 2 2" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
      <text x="50" y="33" class="node-text">OAuth2 &amp; OIDC</text>
    </g>

    <!-- Center Hub: Central Identity Engine -->
    <g transform="translate(130, 130)">
      <circle cx="70" cy="70" r="48" fill="#0f172a" stroke="#a855f7" stroke-width="2.5" filter="url(#glowPurple)" />
      <circle cx="70" cy="70" r="38" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-dasharray="4,4" />
      <!-- Shield Centerpiece -->
      <path d="M 70 54 L 84 60 V 72 C 84 81 78 88 70 91 C 62 88 56 81 56 72 V 60 Z" fill="url(#neonCyan)" />
      <path d="M 66 72 L 69 75 L 75 67" stroke="#0f172a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    </g>

    <!-- Node 3: Passkeys / FIDO2 -->
    <g class="floating-card-3" transform="translate(30, 200)">
      <rect width="160" height="56" rx="14" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.5" filter="drop-shadow(0 4px 12px rgba(52,211,153,0.2))" />
      <circle cx="28" cy="28" r="12" fill="#059669" />
      <!-- Fingerprint / Touch ID Icon -->
      <path d="M 23 28 a 6 6 0 0 1 10 0 m -8 3 a 4 4 0 0 1 6 0 m -4 3 v 1" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" fill="none" />
      <text x="48" y="33" class="node-text">FIDO2 Passkeys</text>
    </g>

    <!-- Node 4: PAM & Cloud Directory -->
    <g class="floating-card-1" transform="translate(230, 240)">
      <rect width="180" height="56" rx="14" fill="url(#cardGrad)" stroke="#f43f5e" stroke-width="1.5" filter="drop-shadow(0 4px 12px rgba(244,63,94,0.2))" />
      <circle cx="28" cy="28" r="12" fill="#e11d48" />
      <!-- Server Cluster Icon -->
      <rect x="22" y="22" width="12" height="4" rx="1" stroke="#ffffff" stroke-width="1.2" fill="none" />
      <rect x="22" y="28" width="12" height="4" rx="1" stroke="#ffffff" stroke-width="1.2" fill="none" />
      <circle cx="31" cy="24" r="0.8" fill="#ffffff" />
      <circle cx="31" cy="30" r="0.8" fill="#ffffff" />
      <text x="48" y="33" class="node-text">PAM &amp; Cloud IAM</text>
    </g>
  </g>

  <!-- Foreground Title, Subtitle, and Feature Highlights (Never Obscured) -->
  <g transform="translate(80, 80)">
    <!-- Category Badge -->
    <g transform="translate(0, 0)">
      <rect width="260" height="32" rx="16" fill="url(#badgeGrad)" opacity="0.95" />
      <text x="18" y="21" class="badge-text">🛡️ ENTERPRISE SECURITY &amp; IAM</text>
    </g>

    <!-- Main Title with Gradient Fill -->
    <text x="0" y="90" class="title-text" fill="url(#neonCyan)">Awesome IAM &amp; SSO</text>

    <!-- Subtitle and Meta -->
    <text x="0" y="132" class="subtitle-text">Curated Architectures, Open-Source Solutions &amp; SaaS Platforms</text>
    <text x="0" y="162" class="subtitle-text" font-size="16px" fill="#64748b">Identity Providers • Zero Trust • OAuth2/OIDC • Passkeys • PAM • Bastions</text>

    <!-- Feature Pills in Crisp Foreground -->
    <g transform="translate(0, 195)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="140" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="17" r="4" fill="#38bdf8" />
      <text x="28" y="22" class="badge-text" fill="#cbd5e1">25+ Open Source</text>

      <!-- Pill 2 -->
      <rect x="155" y="0" width="145" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="171" cy="17" r="4" fill="#a855f7" />
      <text x="183" y="22" class="badge-text" fill="#cbd5e1">SaaS &amp; Valuation</text>

      <!-- Pill 3 -->
      <rect x="315" y="0" width="140" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="331" cy="17" r="4" fill="#34d399" />
      <text x="343" y="22" class="badge-text" fill="#cbd5e1">Transparent Pricing</text>
    </g>

    <!-- Accent Border Stripe -->
    <rect x="0" y="255" width="480" height="2" rx="1" fill="url(#neonCyan)" opacity="0.7" />
  </g>
</svg>
